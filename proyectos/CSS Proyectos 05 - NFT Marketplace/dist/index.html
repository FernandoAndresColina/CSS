<!doctype html>
<html lang="">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CSS Proyecto 05 - NFT Marketplace</title>
    <link rel="stylesheet" href="css/style.css" />
    <meta name="description" content="" />

    <meta property="og:title" content="" />
    <meta property="og:type" content="" />
    <meta property="og:url" content="" />
    <meta property="og:image" content="" />
    <meta property="og:image:alt" content="" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon.png" />

    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#fafafa" />
  </head>

  <body>
    <header class="header">
      <a href="#" class="header__logo">
        <img src="img/nft-logo.svg" alt="Logotipo de NFT Marketplace" />
      </a>

      <nav class="principal__nav">
        <ul>
          <li><a href="#">Market</a></li>
          <li><a href="#">How it works</a></li>
          <li><a href="#">Gallery</a></li>
          <li><a href="#">About</a></li>
        </ul>
      </nav>

      <aside class="login">
        <ul>
          <li><a href="#">Sign Up</a></li>
          <li><a href="#">Sign In</a></li>
        </ul>
      </aside>
    </header>

    <main>
      <section class="hero">
        <h1>The largest NFT market with exceptional items on the bid</h1>
        <p class="hero__subtitle">
          Collectible and non-fungible tokens in your hands
        </p>
        <div class="hero__buttom">
          <a href="#">Explore</a>
          <a href="#">Learn more <img src="img/arrow-right.svg" alt="" /></a>
        </div>
      </section>

      <section class="featured">
        <h2 class="featured__title">Featured Artwork</h2>
        <div class="featured__imgs">
          <img width="400" src="img/proyecto1-img.png" alt="" />
          <img width="400" src="img/proyecto2-img.png" alt="" />
        </div>
      </section>

      <article class="nft">
        <div class="nft__imagencontainer">
          <img src="img/nft-img.png" alt="" />
        </div>
      </article>
    </main>
  </body>
</html>
