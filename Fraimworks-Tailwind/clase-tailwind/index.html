<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>clase-tailwind</title>
  </head>
  <body>
    <header class="flex items-center justify-between p-4 bg-gray-100 shadow-sm">
      <h1 class="font-bold">My portfolio</h1>
      <nav class="hidden md:flex gap-4" md:gap-4 id="main-van">
        <a href="#" class="hover:text-blue-500">Home</a>
        <a href="#" class="hover:text-blue-500">About</a>
        <a href="#" class="hover:text-blue-500">Contact</a>
      </nav>
      <button class="block md:hidden" id="mobile-nav-btn">
        <span class="block w-6 h-[2px] bg-black mb-1"></span>
        <span class="block w-6 h-[2px] bg-black mb-1"></span>
        <span class="block w-6 h-[2px] bg-black mb-1"></span>
      </button>
    </header>
    <section
      class="flex flex-col md:flex-row items-center justify-around bg-gradient-to-r from-primary to-secondary text-primary-foreground py-12 px-4 gap-4"
    >
      <div class="text-center md:text-left">
        <h1 class="text-4x1 md:text-5xl font-bold mb-4">
          Welcome to my portfolio
        </h1>
        <p class="text-xl mb-6">
          Hi! I'm a web developer, discover my skills and services
        </p>
        <div class="flex flex-col md:flex-row gap-4">
          <a
            class="px-6 py-3 bg-primary text-primary-foreground rounded-md shadow-md hover:bg-secondary"
            href=""
            >Get started</a
          >
          <a
            class="px-6 py-3 bg-secondary text-primary-foreground rounded-md shadow-md hover:bg-primary"
            href=""
            >Learn more</a
          >
        </div>
      </div>
      <div>
        <img
          src="https://placehold.co/600x400"
          alt="placeholder"
          class="rounded"
          max-w-xs
          md:max-w-md
        />
      </div>
    </section>
  </body>
  <script>
    const menuBtn = document.querySelector("#mobile-nav-btn");
    const mainNav = document.querySelector("#main-van");

    menuBtn.addEventListener("click", () => {
      mainNav.classList.toggle("hidden");
    });
  </script>
</html>
